name: CI

# PR gate: the exact local gate (typecheck, lint, format check, verify suite,
# build, API docs) surfaced as visible PR checks — same commands, one job.
# The long capture flows (dev server + Chromium headless renders) stay out on
# purpose; they remain local/manual verification in host projects.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Verify engine seams (DI proof, headless)
        run: npm run verify
      - name: Build
        run: npm run build
      - name: Generate API docs (validity gate)
        run: npm run docs:api
